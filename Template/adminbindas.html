<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/dashboard.css">
    <title>Bindass Play</title>
</head>
<body>
    <div class="container">
        <header>
            <div class="header ftitle">
                <a href="/usersData">BINDAS PLAY WIN</a>
            </div>
            
            <form action="/searchAll">
                <div class="subheader">
                    <div class="subheader-title">
                        Select Date
                    </div>
                    <div class="InputDate">
                        <input type="date" name="date">
                    </div>
                    <div class="Btn">
                        <button>Show Results</button>
                    </div>
                </div>
            </form>

            <div class="subheader2">
                <a href="/notification">Add Notification</a>
            </div>
            
        </header>

        <main>
            <table class="switches">
                
                <tbody>
                    <tr>
                        <td>
                            <a href="/atypeSubmit1" id="btn1">
                                Automatic
                            </a>
                        </td>
                        <td>
                            <a href="/atypeSubmit2" id="btn2">
                                Automatic
                            </a>
                        </td>
                        <td>
                            <a href="/atypeSubmit3" id="btn3">
                                Automatic
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>

            <table>
                <thead>
                    <tr>
                        <th style="background: yellow;">Time</th>
                        <th style="background: orange;">Bindass A-11</th>
                        <th style="background: lightgreen;">Bindass B-22</th>
                        <th style="background: pink;">Bindass C-55</th>
                    </tr>
                </thead>
                <form action="/asaveresult">
                    <tbody>
                        <tr>
                            <td>
                                <select id="timeSelect" name="time" class="Select">
                                    <option value="">Loading time slots...</option>
                                </select>
                            </td>
                            <td>
                                <input class="numberInput" type="number" min="00" max="99" name="number1" id="n1" >
                            </td>
                            <td>
                                <input class="numberInput" type="number" min="00" max="99" name="number2" id="n2" >
                            </td>
                            <td>
                                <input class="numberInput" type="number" min="00" max="99" name="number3" id="n3" >
                            </td>
                        </tr>
                        <tr >
                            <td colspan="4">
                                <button type="submit" class="saveBtn">Save</button>
                            </td>
                        </tr>
                        
                    </tbody>
        
                </form>
            </table>
            <div class="status">
                {% if status %}
                    <div style="color: green;">
                        Result Saved
                    </div>
                {% elif status %}
                    <div style="color: red;">
                        Fail to Save Result
                    </div>
                {% endif %}
            </div>
        </main>
        
    </div>
<script>
    const timeSlots = [
        { value: '10:00', label: '10:00am' },
        { value: '10:30', label: '10:30am' },
        { value: '11:00', label: '11:00am' },
        { value: '11:30', label: '11:30am' },
        { value: '12:00', label: '12:00pm' },
        { value: '12:30', label: '12:30pm' },
        { value: '13:00', label: '1:00pm' },
        { value: '13:30', label: '1:30pm' },
        { value: '14:00', label: '2:00pm' },
        { value: '14:30', label: '2:30pm' },
        { value: '15:00', label: '3:00pm' },
        { value: '15:30', label: '3:30pm' },
        { value: '16:00', label: '4:00pm' },
        { value: '16:30', label: '4:30pm' },
        { value: '17:00', label: '5:00pm' },
        { value: '17:30', label: '5:30pm' },
        { value: '18:00', label: '6:00pm' },
        { value: '18:30', label: '6:30pm' },
        { value: '19:00', label: '7:00pm' },
        { value: '19:30', label: '7:30pm' },
        { value: '20:00', label: '8:00pm' },
        { value: '20:30', label: '8:30pm' },
        { value: '21:00', label: '9:00pm' },
        { value: '21:30', label: '9:30pm' },
        { value: '22:00', label: '10:00pm' }
    ];

    function toMinutes(timeValue) {
        const [hours, minutes] = timeValue.split(':').map(Number);
        return hours * 60 + minutes;
    }

    function renderTimeSlots() {
        const select = document.getElementById('timeSelect');
        if (!select) return;

        const now = new Date();
        const currentMinutes = now.getHours() * 60 + now.getMinutes();

        const futureSlots = timeSlots.filter(slot => {
            const slotMinutes = toMinutes(slot.value);
            const diffMinutes = slotMinutes - currentMinutes;
            return diffMinutes > 1;
        });

        select.innerHTML = '';

        if (futureSlots.length === 0) {
            const option = document.createElement('option');
            option.value = '';
            option.textContent = 'No future slots available';
            select.appendChild(option);
            select.disabled = true;
            return;
        }

        select.disabled = false;

        futureSlots.forEach(slot => {
            const option = document.createElement('option');
            option.value = slot.value;
            option.textContent = slot.label;
            select.appendChild(option);
        });
    }

    renderTimeSlots();

    let btn1 = document.querySelector('#btn1');
    let btn2 = document.querySelector('#btn2');
    let btn3 = document.querySelector('#btn3');
    var date = new Date();
	var current_time = date.getHours()
    console.log(current_time)
    if(current_time==1){
        localStorage.setItem("type1","Manual");
        localStorage.setItem("type2","Manual");
        localStorage.setItem("type3","Manual");
    }
    window.addEventListener('load', () =>{
        let type1 = localStorage.getItem("type1")
        if(type1=="Automatic"){
            btn1.text = 'Automatic';
        }else{
            btn1.text = 'Manual';
        }
    });
    window.addEventListener('load', () =>{
        let type2 = localStorage.getItem("type2")
        if(type2=="Automatic"){
            btn2.text ='Automatic';
        }else{
            btn2.text = 'Manual';
        }
    });
    window.addEventListener('load', () =>{
        let type3 = localStorage.getItem("type3")
        if(type3=="Automatic"){
            btn3.text = 'Automatic';
        }else{
            btn3.text= 'Manual';
        }
    });
    btn1.addEventListener('click', () =>{
        let type1 = localStorage.getItem("type1")
        if(type1=="Automatic"){
            localStorage.setItem("type1","Manual")
            btn1.text = 'Manual';
        }else{
            localStorage.setItem("type1","Automatic")
            btn1.text= 'Automatic';
        }
    });

    btn2.addEventListener('click', () =>{
        let type2 = localStorage.getItem("type2")
        if(type2=="Automatic"){
            localStorage.setItem("type2","Manual")
            btn2.text= 'Manual';
        }else{
            localStorage.setItem("type2","Automatic");
            btn2.text = 'Automatic'
        }
    });
    btn3.addEventListener('click', () =>{
        let type3 = localStorage.getItem("type3")
        if(type3=="Automatic"){
            localStorage.setItem("type3","Manual");;
            btn3.text = 'Manual';
        }else{
            localStorage.setItem("type3","Automatic");
            btn3.text = 'Automatic';
        }
    });

    // function logoutAfterInactivity() {
    //     setTimeout(function() {
    //       window.location.href = '/';  // 
    //     },12*60*60 * 1000);  // 30 minutes * 60 seconds * 1000 milliseconds
    //   }

    // document.addEventListener('DOMContentLoaded', function() {
    //     logoutAfterInactivity();
    // });
      
    
</script>


<script src = "https://ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
</body>
</html>
